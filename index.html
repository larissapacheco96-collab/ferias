<script type="module">

import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  apiKey: "AIzaSyAUgos_F0fgtVIktaqbg_YRQEEVy8OSLMw",

  appId: "1:438767798721:web:b0dff5924fdd8b5cc70740"

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── TIMES E COLABORADORES ──
const TIMES = {
  Fernanda:  {cor:"#e8506a", bg:"#fdf0f2"},
  Gabriela:  {cor:"#5c6bc0", bg:"#eff0fb"},
  Gabryel:   {cor:"#26a69a", bg:"#e0f5f3"},

};

const COLABORADORES = [

  {nome:"Douglas", time:"Guilherme"},
  {nome:"Jessica Cardoso", time:"Guilherme"},
  {nome:"Maria Luiza", time:"Guilherme"},

  // Lauanny
  {nome:"Felipe Neves", time:"Lauanny"},

];

const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

// Saldo base: 20 dias para Pacheco, Geovana e Walter; 30 para demais
function saldoBase(nome) {
  if(!nome) return 30;
  var n = nome.toLowerCase();
  if(n.includes("pacheco") || n === "geovana" || n === "walter") return 20;
  return 30;
}

// Get periodos from record — supports old format (inicio/fim) and new format (periodos array)
function getPeriodos(r) {
  if(r.periodos && r.periodos.length > 0) return r.periodos;
  // Old format: single periodo with inicio/fim fields
  if(r.inicio || r.inicioFerias) {
    var ini = r.inicio || r.inicioFerias || "";
    var fim = r.fim || r.fimFerias || "";
    if(ini) return [{inicio:ini, fim:fim, concluido:false}];
  }
  return [];
}

function diasEntre(ini, fim) {
  if(!ini || !fim) return 0;
  var a = new Date(ini + "T00:00:00");
  var b = new Date(fim + "T00:00:00");
  if(b < a) return 0;
  return Math.round((b - a) / 86400000) + 1;
}

function fmtDate(iso) {
  if(!iso) return "";
  var p = iso.split("-");
  return p[2]+"/"+p[1]+"/"+p[0];
}

function fmtDateShort(iso) {
  if(!iso) return "";
  var p = iso.split("-");
  return p[2]+"/"+p[1];
}

// ── STATE ──
var DADOS = [];
var activeTab = "dashboard";
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth();

// ── INIT ──
document.getElementById("dataHoje").textContent = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});

const q = collection(db,"ferias");
onSnapshot(q, function(snap){
  DADOS = snap.docs.map(function(d){ var x=d.data(); x.id=d.id; return x; });
  DADOS.sort(function(a,b){return (a.nome||"").localeCompare(b.nome||"");});
  render();
}, function(err){ showToast("Erro Firebase: "+err.message, true); });

// ── TABS ──
window.showTab = function(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.toggle("on", b.dataset.tab===tab); });
  document.querySelectorAll(".tab-view").forEach(function(v){ v.classList.toggle("on", v.id==="view-"+tab); });
  if(tab==="calendario") renderCalendario();
};

// ── RENDER ──
function render() {
  renderDashboard();
  renderRegistros();
  if(activeTab==="calendario") renderCalendario();
}

// ── DASHBOARD ──
function renderDashboard() {
  // Alertas
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var alertas = [];
  DADOS.forEach(function(r){
    if(r.dataLimite) {
      var dl = new Date(r.dataLimite+"T00:00:00");
      var diff = Math.round((dl-hoje)/86400000);
      if(diff <= 60 && diff >= 0) alertas.push({nome:r.nome, diff:diff, dl:r.dataLimite});
      if(diff < 0) alertas.push({nome:r.nome, diff:diff, dl:r.dataLimite, vencido:true});
    }
  });
  alertas.sort(function(a,b){return a.diff-b.diff;});
  var aEl = document.getElementById("alertas");
  if(alertas.length===0){
    aEl.innerHTML = '<div class="no-alert">✅ Nenhum vencimento próximo.</div>';
  } else {
    aEl.innerHTML = alertas.map(function(a){
      var cls = a.vencido?"alert-item vencido":a.diff<=30?"alert-item urgente":"alert-item";
      var txt = a.vencido?"VENCIDO há "+Math.abs(a.diff)+"d":a.diff===0?"Vence HOJE":"Vence em "+a.diff+" dias";
      return '<div class="'+cls+'"><span class="alert-nome">'+esc(a.nome)+'</span><span class="alert-txt">'+txt+' ('+fmtDate(a.dl)+')</span></div>';
    }).join("");
  }

  // Cards por time
  var grid = document.getElementById("dashGrid");
  grid.innerHTML = "";
  Object.keys(TIMES).forEach(function(t){
    var membros = DADOS.filter(function(r){return r.time===t;});
    if(membros.length===0) return;
    var card = document.createElement("div"); card.className="dash-card";
    var cor = TIMES[t].cor; var bg = TIMES[t].bg;
    card.innerHTML = '<div class="dash-card-hdr" style="background:'+cor+'">Time '+esc(t)+'</div><div class="dash-card-body" style="background:'+bg+'">';
    var rows = "";
    membros.forEach(function(r){
      var periodos = getPeriodos(r);
      var usados = periodos.reduce(function(s,p){return s+(p.concluido?diasEntre(p.inicio,p.fim):0);},0);
      var agend = periodos.reduce(function(s,p){return s+(!p.concluido?diasEntre(p.inicio,p.fim):0);},0);
      var base = saldoBase(r.nome);
      var disp = Math.max(0, base - usados - agend);
      var pct = Math.round((usados+agend)/base*100);
      rows += '<div class="dash-membro">'
        +'<div class="dash-membro-nome">'+esc(r.nome)+'</div>'
        +'<div class="dash-membro-bar"><div class="dash-bar-fill" style="width:'+Math.min(pct,100)+'%;background:'+cor+'"></div></div>'
        +'<div class="dash-membro-info"><span class="tag-usado">'+usados+'d usados</span><span class="tag-agend">'+agend+'d agend.</span><span class="tag-disp">'+disp+'d disp.</span></div>'
        +'</div>';
    });
    card.innerHTML += rows + '</div>';
    grid.appendChild(card);
  });
}

// ── REGISTROS (tabela inline) ──
function renderRegistros() {
  var tbody = document.getElementById("regTable");
  tbody.innerHTML = "";
  if(DADOS.length===0){
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--mu);">Nenhum registro ainda.</td></tr>';
    return;
  }
  DADOS.forEach(function(r){
    var periodos = getPeriodos(r);
    var usados = periodos.reduce(function(s,p){return s+(p.concluido?diasEntre(p.inicio,p.fim):0);},0);
    var agend = periodos.reduce(function(s,p){return s+(!p.concluido?diasEntre(p.inicio,p.fim):0);},0);
    var base = saldoBase(r.nome);
    var disp = Math.max(0, base - usados - agend);
    var cor = (TIMES[r.time]||{}).cor||"#888";
    var bg = (TIMES[r.time]||{}).bg||"#f4f4f4";

    // Main row
    var tr = document.createElement("tr"); tr.className="reg-row";
    tr.innerHTML =
      '<td><div class="reg-nome">'+esc(r.nome)+'</div><div class="reg-time" style="color:'+cor+'">Time '+esc(r.time||"")+'</div></td>'
      +'<td><div class="saldo-wrap"><span class="saldo-usado">'+usados+'d</span><span class="saldo-agend">'+agend+'d</span><span class="saldo-disp">'+disp+'d</span></div><div class="saldo-bar-wrap"><div class="saldo-bar-fill" style="width:'+Math.min(Math.round((usados+agend)/base*100),100)+'%;background:'+cor+'"></div></div></td>'
      +'<td><div class="periodos-list" id="pl-'+r.id+'">'+renderPeriodosInline(r, cor)+'</div><button class="add-periodo-btn" onclick="addPeriodo(''+r.id+'')">+ período</button></td>'
      +'<td>'+esc(r.periodoAquisitivo||"")+'</td>'
      +'<td>'+(r.dataLimite?'<span class="'+(new Date(r.dataLimite+"T00:00:00")<new Date()?"txt-vencido":"txt-limite")+'">'+fmtDate(r.dataLimite)+'</span>':"—")+'</td>'
      +'<td><button class="btn-edit" onclick="editReg(''+r.id+'')">✏️</button><button class="btn-del" onclick="delReg(''+r.id+'')">✕</button></td>';
    tbody.appendChild(tr);
  });
}

function renderPeriodosInline(r, cor) {
  var periodos = getPeriodos(r);
  if(periodos.length===0) return '<span style="color:var(--mu);font-size:12px;font-style:italic;">Nenhum período</span>';
  return periodos.map(function(p,i){
    var dias = diasEntre(p.inicio,p.fim);
    var cls = p.concluido?"periodo-tag concluido":"periodo-tag agendado";
    return '<span class="'+cls+'" style="border-color:'+cor+'">'
      +fmtDateShort(p.inicio)+' – '+fmtDateShort(p.fim)
      +' <strong>('+dias+'d)</strong>'
      +' <button class="tag-rm" onclick="removePeriodo(''+r.id+'','+i+')">×</button>'
      +' <button class="tag-chk" onclick="togglePeriodo(''+r.id+'','+i+','+(!p.concluido)+')" title="'+(p.concluido?"Marcar pendente":"Marcar concluído")+'">'+(p.concluido?"↩":"✓")+'</button>'
      +'</span>';
  }).join("");
}

// ── PERIODOS ──
window.addPeriodo = function(id) {
  var r = DADOS.find(function(x){return x.id===id;});
  if(!r) return;
  var base = saldoBase(r.nome);
  var periodos = getPeriodos(r);
  var usados = periodos.reduce(function(s,p){return s+diasEntre(p.inicio,p.fim);},0);
  var disp = base - usados;

  // Show inline form
  var pl = document.getElementById("pl-"+id);
  if(document.getElementById("pform-"+id)) return; // already open
  var form = document.createElement("div"); form.className="periodo-form"; form.id="pform-"+id;
  form.innerHTML =
    '<input type="date" id="pi-'+id+'" class="pf-inp" placeholder="Início">'
    +'<input type="date" id="pf-'+id+'" class="pf-inp" placeholder="Fim">'
    +'<span class="pf-dias" id="pd-'+id+'">0d</span>'
    +'<span class="pf-saldo">saldo: '+disp+'d</span>'
    +'<button class="pf-save" onclick="savePeriodo(''+id+'')">✓</button>'
    +'<button class="pf-cancel" onclick="cancelPeriodo(''+id+'')">✕</button>';
  pl.appendChild(form);

  // Auto-calc dias
  function calcDias(){
    var ini = document.getElementById("pi-"+id).value;
    var fim = document.getElementById("pf-"+id).value;
    var d = diasEntre(ini,fim);
    document.getElementById("pd-"+id).textContent = d+"d";
    document.getElementById("pd-"+id).style.color = d>disp?"#c0392b":"var(--green)";
  }
  document.getElementById("pi-"+id).addEventListener("change",calcDias);
  document.getElementById("pf-"+id).addEventListener("change",calcDias);
};

window.cancelPeriodo = function(id){
  var f = document.getElementById("pform-"+id);
  if(f) f.remove();
};

window.savePeriodo = async function(id){
  var ini = document.getElementById("pi-"+id).value;
  var fim = document.getElementById("pf-"+id).value;
  if(!ini||!fim){showToast("Informe início e fim.",true);return;}
  if(fim<ini){showToast("Fim deve ser após início.",true);return;}
  var r = DADOS.find(function(x){return x.id===id;});
  var periodos = JSON.parse(JSON.stringify(getPeriodos(r)));
  periodos.push({inicio:ini, fim:fim, concluido:false});
  await updateDoc(doc(db,"ferias",id),{periodos:periodos});
  showToast("📅 Período adicionado!");
};

window.removePeriodo = async function(id, idx){
  if(!confirm("Remover este período?")) return;
  var r = DADOS.find(function(x){return x.id===id;});
  var periodos = JSON.parse(JSON.stringify(getPeriodos(r)));
  periodos.splice(idx,1);
  await updateDoc(doc(db,"ferias",id),{periodos:periodos});
  showToast("Período removido.");
};

window.togglePeriodo = async function(id, idx, val){
  var r = DADOS.find(function(x){return x.id===id;});
  var periodos = JSON.parse(JSON.stringify(getPeriodos(r)));
  periodos[idx].concluido = val;
  await updateDoc(doc(db,"ferias",id),{periodos:periodos});
  showToast(val?"✅ Marcado como concluído.":"↩️ Marcado como pendente.");
};

// ── MODAL REGISTRO (novo/editar) ──
window.abrirModal = function(id) {
  var r = id ? DADOS.find(function(x){return x.id===id;}) : null;
  document.getElementById("modalId").value = id||"";
  document.getElementById("modalNome").value = r?r.nome:"";
  document.getElementById("modalTime").value = r?r.time:"";
  document.getElementById("modalPeriodoAq").value = r?r.periodoAquisitivo||"":"";
  document.getElementById("modalDataLimite").value = r?r.dataLimite||"":"";
  document.getElementById("modalTitle").textContent = r?"Editar Colaborador":"Novo Colaborador";
  document.getElementById("modal").classList.add("on");
  document.getElementById("btnDel").style.display = id?"inline-flex":"none";
};

window.fecharModal = function(){ document.getElementById("modal").classList.remove("on"); };

window.salvarModal = async function(){
  var id = document.getElementById("modalId").value;
  var nome = document.getElementById("modalNome").value.trim();
  var time = document.getElementById("modalTime").value;
  var pa = document.getElementById("modalPeriodoAq").value.trim();
  var dl = document.getElementById("modalDataLimite").value;
  if(!nome||!time){showToast("Nome e time são obrigatórios.",true);return;}
  var data = {nome:nome, time:time, periodoAquisitivo:pa, dataLimite:dl||null};
  if(id){
    await updateDoc(doc(db,"ferias",id), data);
    showToast("✏️ Atualizado!");
  } else {
    data.periodos = [];
    await addDoc(collection(db,"ferias"), data);
    showToast("✅ Colaborador adicionado!");
  }
  fecharModal();
};

window.editReg = function(id){ abrirModal(id); };

window.delReg = async function(id){
  if(!confirm("Excluir este registro?")) return;
  await deleteDoc(doc(db,"ferias",id));
  showToast("Excluído.");
};

window.confirmarDelete = async function(){
  var id = document.getElementById("modalId").value;
  if(!id) return;
  if(!confirm("Excluir este colaborador e todos os seus períodos?")) return;
  await deleteDoc(doc(db,"ferias",id));
  fecharModal();
  showToast("Excluído.");
};

// ── CALENDÁRIO ──
window.chCalMonth = function(d){
  calMonth += d;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCalendario();
};
window.chCalYear = function(d){ calYear += d; renderCalendario(); };

function renderCalendario() {
  document.getElementById("calLabel").textContent = MESES[calMonth]+" "+calYear;
  var grid = document.getElementById("calGrid");
  grid.innerHTML = "";

  var priDia = new Date(calYear, calMonth, 1).getDay();
  var ultDia = new Date(calYear, calMonth+1, 0).getDate();
  var hoje = new Date().toISOString().slice(0,10);
  var diasSemana = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

  diasSemana.forEach(function(d){
    var h = document.createElement("div"); h.className="cal-hdr-cell"; h.textContent=d;
    grid.appendChild(h);
  });

  for(var i=0;i<priDia;i++){
    var empty = document.createElement("div"); empty.className="cal-cell empty"; grid.appendChild(empty);
  }

  for(var d=1;d<=ultDia;d++){
    var dateStr = calYear+"-"+String(calMonth+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var cell = document.createElement("div"); cell.className="cal-cell"+(dateStr===hoje?" hoje":"");
    var num = document.createElement("div"); num.className="cal-num"; num.textContent=d;
    cell.appendChild(num);

    // Find who has vacation on this day
    DADOS.forEach(function(r){
      (r.periodos||[]).forEach(function(p){
        if(p.inicio && p.fim && dateStr>=p.inicio && dateStr<=p.fim){
          var cor = (TIMES[r.time]||{}).cor||"#888";
          var chip = document.createElement("div"); chip.className="cal-chip";
          chip.style.background = cor;
          chip.textContent = r.nome.split(" ")[0];
          cell.appendChild(chip);
        }
      });
    });
    grid.appendChild(cell);
  }
}

// ── UTILS ──
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var _tt;
function showToast(msg, err){
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast on"+(err?" err":"");
  clearTimeout(_tt); _tt = setTimeout(function(){t.classList.remove("on");},3000);
}
window.showToast = showToast;
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#1a8a7a;--td:#0f6358;--tl:#e8f5f3;
  --bg:#f4f7f6;--wh:#fff;--text:#1c2b2a;--mu:#6b8580;--bo:#d0e5e2;
  --sh:0 4px 20px rgba(26,138,122,.09);
  --green:#2a9d5c;--orange:#e07b3a;--pink:#d4688a;
}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
/* HEADER */
.hdr{background:linear-gradient(135deg,var(--td),var(--teal) 60%,#2bb09d);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 16px rgba(15,99,88,.18);}
.logo{height:40px;object-fit:contain;}
.hdr-r{text-align:right;}
.hdr-title{font-family:"Playfair Display",serif;font-style:italic;font-size:18px;color:white;}
.hdr-date{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px;text-transform:capitalize;}
/* TABS */
.tabs{background:var(--td);display:flex;padding:0 24px;}
.tab-btn{padding:11px 18px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.45);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;}
.tab-btn:hover{color:rgba(255,255,255,.8);}
.tab-btn.on{color:white;border-bottom-color:#f0c060;}
/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:24px 20px 48px;}
.tab-view{display:none;}
.tab-view.on{display:block;}
/* TOP BAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.top-bar h2{font-family:"Playfair Display",serif;font-style:italic;font-size:22px;color:var(--td);}
.btn-novo{background:var(--teal);color:white;border:none;border-radius:10px;padding:9px 18px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
.btn-novo:hover{background:var(--td);}
/* DASHBOARD */
.alertas-box{background:var(--wh);border-radius:14px;padding:16px 20px;margin-bottom:20px;box-shadow:var(--sh);border:1.5px solid var(--bo);}
.alertas-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--td);margin-bottom:12px;}
.no-alert{font-size:13px;color:var(--mu);font-style:italic;}
.alert-item{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:8px;margin-bottom:6px;background:#fff8f0;border-left:3px solid var(--orange);}
.alert-item.urgente{background:#fff0f0;border-left-color:#c0392b;}
.alert-item.vencido{background:#fde8e8;border-left-color:#c0392b;}
.alert-nome{font-size:13px;font-weight:600;}
.alert-txt{font-size:12px;color:var(--mu);margin-left:auto;}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.dash-card{background:var(--wh);border-radius:14px;overflow:hidden;box-shadow:var(--sh);border:1.5px solid var(--bo);}
.dash-card-hdr{padding:10px 14px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:700;color:white;text-transform:uppercase;letter-spacing:.5px;}
.dash-card-body{padding:10px 14px;}
.dash-membro{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(0,0,0,.06);}
.dash-membro:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.dash-membro-nome{font-size:13px;font-weight:600;margin-bottom:3px;}
.dash-membro-bar{height:5px;background:#e8e8e8;border-radius:5px;overflow:hidden;margin-bottom:4px;}
.dash-bar-fill{height:100%;border-radius:5px;transition:width .3s;}
.dash-membro-info{display:flex;gap:6px;flex-wrap:wrap;}
.tag-usado,.tag-agend,.tag-disp{font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;}
.tag-usado{background:#fde8e8;color:#c0392b;}
.tag-agend{background:#fff3cc;color:#8a6000;}
.tag-disp{background:#e8fff0;color:#1a7a4a;}
/* REGISTROS */
.reg-table-wrap{background:var(--wh);border-radius:14px;box-shadow:var(--sh);border:1.5px solid var(--bo);overflow:auto;}
table{width:100%;border-collapse:collapse;}
th{padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mu);text-align:left;border-bottom:1.5px solid var(--bo);background:#fafffe;white-space:nowrap;}
td{padding:10px 14px;border-bottom:1px solid var(--tl);vertical-align:top;}
.reg-row:hover{background:var(--tl);}
.reg-nome{font-size:13px;font-weight:600;}
.reg-time{font-size:11px;font-weight:600;margin-top:1px;}
/* SALDO */
.saldo-wrap{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px;}
.saldo-usado,.saldo-agend,.saldo-disp{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;}
.saldo-usado{background:#fde8e8;color:#c0392b;}
.saldo-agend{background:#fff3cc;color:#8a6000;}
.saldo-disp{background:#e8fff0;color:#1a7a4a;}
.saldo-bar-wrap{height:4px;background:#e8e8e8;border-radius:4px;overflow:hidden;width:100px;}
.saldo-bar-fill{height:100%;border-radius:4px;}
/* PERIODOS INLINE */
.periodos-list{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.periodo-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px;border:1.5px solid;background:white;line-height:1.3;}
.periodo-tag.agendado{background:#fff8e8;}
.periodo-tag.concluido{background:#e8fff0;text-decoration:line-through;opacity:.7;}
.tag-rm{background:none;border:none;cursor:pointer;font-size:12px;color:#c0392b;padding:0 1px;line-height:1;}
.tag-chk{background:none;border:none;cursor:pointer;font-size:11px;color:var(--teal);padding:0 1px;line-height:1;font-weight:700;}
.add-periodo-btn{font-size:11px;font-weight:600;color:var(--teal);background:var(--tl);border:1.5px dashed var(--teal);border-radius:8px;padding:2px 10px;cursor:pointer;transition:all .15s;}
.add-periodo-btn:hover{background:var(--teal);color:white;border-style:solid;}
/* FORM PERIODO INLINE */
.periodo-form{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;background:#f0faf8;border-radius:10px;padding:8px 10px;border:1.5px solid var(--teal);}
.pf-inp{padding:5px 8px;border-radius:7px;border:1.5px solid var(--bo);font-family:"DM Sans",sans-serif;font-size:12px;color:var(--text);outline:none;}
.pf-inp:focus{border-color:var(--teal);}
.pf-dias{font-size:12px;font-weight:700;color:var(--td);min-width:28px;}
.pf-saldo{font-size:11px;color:var(--mu);}
.pf-save{background:var(--teal);color:white;border:none;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;}
.pf-cancel{background:none;border:1.5px solid var(--bo);border-radius:7px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--mu);}
/* BUTTONS */
.btn-edit{background:none;border:1.5px solid var(--teal);border-radius:7px;padding:3px 8px;cursor:pointer;font-size:12px;color:var(--teal);transition:all .15s;}
.btn-edit:hover{background:var(--teal);color:white;}
.btn-del{background:none;border:1.5px solid #f0c0c0;border-radius:7px;padding:3px 8px;cursor:pointer;font-size:12px;color:#c0392b;margin-left:4px;transition:all .15s;}
.btn-del:hover{background:#fdecea;}
.txt-limite{font-size:12px;color:var(--mu);}
.txt-vencido{font-size:12px;color:#c0392b;font-weight:700;}
/* CALENDÁRIO */
.cal-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.cal-nav-btn{background:var(--wh);border:1.5px solid var(--bo);border-radius:9px;padding:6px 14px;cursor:pointer;font-size:15px;color:var(--teal);transition:all .15s;}
.cal-nav-btn:hover{background:var(--tl);}
.cal-label{font-family:"Playfair Display",serif;font-style:italic;font-size:20px;color:var(--td);min-width:200px;text-align:center;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:var(--wh);border-radius:14px;padding:16px;box-shadow:var(--sh);border:1.5px solid var(--bo);}
.cal-hdr-cell{text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);padding:5px 0;}
.cal-cell{min-height:72px;padding:5px;border-radius:9px;border:1.5px solid transparent;background:#fafffe;}
.cal-cell.hoje{border-color:var(--teal);background:var(--tl);}
.cal-cell.empty{background:transparent;border:none;}
.cal-num{font-size:12px;font-weight:700;color:var(--td);margin-bottom:3px;}
.cal-chip{font-size:10px;font-weight:600;color:white;border-radius:6px;padding:1px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,30,28,.5);align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-bg.on{display:flex;}
.modal{background:white;border-radius:18px;padding:26px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal h3{font-family:"Playfair Display",serif;font-size:18px;font-weight:700;color:var(--td);margin-bottom:18px;}
.modal label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:4px;margin-top:10px;}
.modal input,.modal select{width:100%;padding:8px 11px;border-radius:8px;border:1.5px solid var(--bo);font-family:"DM Sans",sans-serif;font-size:13px;color:var(--text);background:white;outline:none;}
.modal input:focus,.modal select:focus{border-color:var(--teal);}
.modal-footer{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
.btn-save{background:var(--teal);color:white;border:none;border-radius:9px;padding:9px 20px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.btn-cancel{background:none;color:var(--mu);border:1.5px solid var(--bo);border-radius:9px;padding:9px 16px;font-family:"DM Sans",sans-serif;font-size:13px;cursor:pointer;}
.btn-danger{background:#c0392b;color:white;border:none;border-radius:9px;padding:9px 16px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:600;cursor:pointer;margin-right:auto;}
/* TOAST */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1c2b2a;color:white;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;}
.toast.on{opacity:1;}
.toast.err{background:#c0392b;}
/* SPINNER */
.spin-wrap{text-align:center;padding:30px;color:var(--mu);font-size:13px;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--bo);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){
  .hdr{flex-direction:column;gap:8px;text-align:center;}
  .main{padding:14px 10px 32px;}
  .cal-grid{gap:3px;padding:10px;}
  .cal-cell{min-height:50px;}
}
</style>
</head>

  <div class="hdr-r">
    <div class="hdr-title">Controle de Férias — Setor Tributário</div>
    <div class="hdr-date" id="dataHoje"></div>
  </div>
</div>
<div class="tabs">
  <button class="tab-btn on" data-tab="dashboard" onclick="showTab('dashboard')">📊 Dashboard</button>
  <button class="tab-btn" data-tab="registros" onclick="showTab('registros')">📋 Registros</button>
  <button class="tab-btn" data-tab="calendario" onclick="showTab('calendario')">📅 Calendário</button>
</div>
<div class="main">

  <!-- DASHBOARD -->
  <div class="tab-view on" id="view-dashboard">
    <div class="top-bar">
      <h2>Visão Geral</h2>
      <button class="btn-novo" onclick="abrirModal()">+ Novo Colaborador</button>
    </div>
    <div class="alertas-box">
      <div class="alertas-title">⚠️ Alertas de Vencimento</div>
      <div id="alertas"><div class="spin-wrap"><span class="spinner"></span>Carregando...</div></div>
    </div>
    <div class="dash-grid" id="dashGrid"><div class="spin-wrap"><span class="spinner"></span>Carregando...</div></div>
  </div>

  <!-- REGISTROS -->
  <div class="tab-view" id="view-registros">
    <div class="top-bar">
      <h2>Registros de Férias</h2>
      <button class="btn-novo" onclick="abrirModal()">+ Novo Colaborador</button>
    </div>
    <div class="reg-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Colaborador</th>
            <th>Saldo</th>
            <th>Períodos de Férias</th>
            <th>Período Aquisitivo</th>
            <th>Data Limite</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="regTable"><tr><td colspan="6"><div class="spin-wrap"><span class="spinner"></span>Carregando...</div></td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- CALENDÁRIO -->
  <div class="tab-view" id="view-calendario">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="chCalYear(-1)">«</button>
      <button class="cal-nav-btn" onclick="chCalMonth(-1)">‹</button>
      <div class="cal-label" id="calLabel"></div>
      <button class="cal-nav-btn" onclick="chCalMonth(1)">›</button>
      <button class="cal-nav-btn" onclick="chCalYear(1)">»</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

</div>

<!-- MODAL COLABORADOR -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)fecharModal()">
  <div class="modal">
    <h3 id="modalTitle">Novo Colaborador</h3>
    <input type="hidden" id="modalId">
    <label>Nome</label>
    <input type="text" id="modalNome" placeholder="Nome completo...">
    <label>Time</label>
    <select id="modalTime">
      <option value="">Selecione...</option>
      <option>Fernanda</option>
      <option>Gabriela</option>
      <option>Gabryel</option>
      <option>Guilherme</option>
      <option>Lauanny</option>
      <option>Larissa</option>
      <option>Jessica</option>
      <option>Geovana</option>
    </select>
    <label>Período Aquisitivo</label>
    <input type="text" id="modalPeriodoAq" placeholder="Ex: 01/2024 – 01/2025">
    <label>Data Limite para Gozo</label>
    <input type="date" id="modalDataLimite">
    <div class="modal-footer">
      <button class="btn-danger" id="btnDel" onclick="confirmarDelete()" style="display:none">🗑 Excluir</button>
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarModal()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
